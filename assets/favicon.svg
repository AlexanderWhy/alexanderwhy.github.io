<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">WHY monogram</title>

  <!-- deep ink-navy tile -->
  <rect width="64" height="64" rx="12" fill="#1F2A44"/>

  <!-- hairline frame in muted gold -->
  <rect x="4" y="4" width="56" height="56" rx="8"
        fill="none" stroke="#C9A24B" stroke-width="1.25" stroke-opacity="0.8"/>

  <!-- monogram -->
  <text x="32" y="40" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="19" font-weight="700" letter-spacing="0.5"
        fill="#F4EBD6">WHY</text>

</svg>
