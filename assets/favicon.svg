<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">HW gold monogram</title>
  <desc id="desc">A polished gold HW monogram on a dark background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#27334a"/>
      <stop offset="1" stop-color="#0d1422"/>
    </radialGradient>
    <linearGradient id="gold" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="0.3" stop-color="#f7cf57"/>
      <stop offset="0.62" stop-color="#d99a16"/>
      <stop offset="1" stop-color="#8f5b05"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M18 18h28" stroke="#fff3a3" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <text x="32" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" letter-spacing="-2" fill="url(#gold)" filter="url(#shadow)">HW</text>
  <path d="M23 47h18" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
